<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>コンビニエント ツカモト</title>
<meta name="description" content="藤枝市瀬戸新屋のコンビニエント ツカモト。修理・鍵・ガラス・網戸・蜂駆除など、暮らしの困りごとに。先ずは何でもご相談下さい。">
<meta property="og:title" content="コンビニエント ツカモト">
<meta property="og:description" content="暮らしの困った、まずはツカモトへ。修理も、交換も、ちょっとした困りごとも。">
<meta property="og:type" content="website">
<meta property="og:locale" content="ja_JP">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b5fc7'/%3E%3Cpath d='M9 22l9-9M17 9l6 6' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout concept: 名刺の水色い配管モチーフを背景に、写真枠を大きく並べる1カラム基調のLP。スマホ優先、PCでは2カラムに広がる。 */
:root{
  --bg:#ffffff;
  --surface:#f1f6fd;
  --ink:#161a20;
  --muted:#4f5a68;
  --line:#d6e2f2;
  --blue-soft:#d9e8fb;
  --blue:#4f93e6;
  --accent:#0b5fc7;
  --on-accent:#ffffff;
  --green:#0b8a4a;
  --green-soft:#dcf3e5;
  --on-green:#ffffff;
  --warn-bg:#fff6dc;
  --warn-ink:#6d5300;
  --ph-a:#e4eefb;
  --ph-b:#d9e8fa;
  --ph-line:#8db6ea;
  --ph-ink:#1f5aa8;
  --shadow:0 10px 30px rgba(11,95,199,.16);
  --font-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --font-body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f151c;--surface:#17202a;--ink:#eaf0f6;--muted:#a9b6c3;--line:#273546;
    --blue-soft:#162f55;--blue:#3b78c9;--accent:#6fb0ff;--on-accent:#08182c;
    --green:#46c98a;--green-soft:#15382a;--on-green:#062414;
    --warn-bg:#3a3014;--warn-ink:#f1d98a;
    --ph-a:#182a40;--ph-b:#1d3350;--ph-line:#4a7bb8;--ph-ink:#a8cdf5;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f151c;--surface:#17202a;--ink:#eaf0f6;--muted:#a9b6c3;--line:#273546;
  --blue-soft:#162f55;--blue:#3b78c9;--accent:#6fb0ff;--on-accent:#08182c;
  --green:#46c98a;--green-soft:#15382a;--on-green:#062414;
  --warn-bg:#3a3014;--warn-ink:#f1d98a;
  --ph-a:#182a40;--ph-b:#1d3350;--ph-line:#4a7bb8;--ph-ink:#a8cdf5;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.85;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;line-height:1.4;margin:0}
p{margin:0}
a{color:inherit}
.wrap{max-width:1080px;margin-inline:auto;padding-inline:20px}
section.sec{padding-block:64px}
section.alt{background:var(--surface)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* demo bar */

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);transition:box-shadow .25s}
.hdr.scrolled{box-shadow:0 2px 14px rgba(43,106,158,.14)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:900;font-size:1.05rem;text-decoration:none;min-width:0}
.logo-mark{flex:none;width:34px;height:34px;border-radius:10px;background:var(--blue-soft);display:grid;place-items:center;color:var(--accent)}
.hdr-tel{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:15px 26px;font-weight:700;font-size:1.05rem;text-decoration:none;border:2px solid var(--accent);transition:transform .15s,box-shadow .15s;cursor:pointer;font-family:inherit;line-height:1.3}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:9px 16px;font-size:.92rem}
.btn svg{flex:none}

/* section head */
.sec-tag{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.08em;color:var(--warn-ink);background:var(--warn-bg);border-radius:6px;padding:2px 8px;margin-bottom:10px;line-height:1.6}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.14em;color:var(--accent);margin-bottom:6px}
.sec-title{font-size:clamp(1.55rem,5.4vw,2.2rem);font-weight:900}
.sec-lead{margin-top:14px;color:var(--muted);max-width:40em}
.sec-head{margin-bottom:34px}

/* photo slot */
.photo{position:relative;overflow:hidden;border-radius:18px;width:100%;max-width:100%;background:repeating-linear-gradient(135deg,var(--ph-a) 0 14px,var(--ph-b) 14px 28px);border:2px dashed var(--ph-line);color:var(--ph-ink)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.photo .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px;text-align:center}
.photo .ph b{font-family:var(--font-display);font-size:.98rem;line-height:1.4}
.photo .ph small{font-size:.74rem;opacity:.85;line-height:1.5}
.photo .ph .chip{margin-top:4px;font-size:.68rem;font-weight:700;border:1px solid var(--ph-line);border-radius:999px;padding:1px 10px;background:var(--bg)}
.photo.has-img{border:0}

/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--surface),var(--bg));padding-block:36px 56px}
.pipe{position:absolute;background:var(--blue-soft);border-radius:999px;z-index:0}
.pipe.p1{width:64px;height:240px;top:-30px;right:6%}
.pipe.p2{width:240px;height:64px;top:150px;right:-60px}
.pipe.p3{width:56px;height:56px;bottom:30px;left:-14px;background:var(--green-soft)}
.pipe.p2{background:var(--green-soft)}
.hero .wrap{position:relative;z-index:1;display:grid;gap:28px}
.hero-copy{display:flex;flex-direction:column;gap:18px;min-width:0}
.hero h1{font-size:clamp(2rem,8.4vw,3.3rem);font-weight:900;letter-spacing:.01em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero-sub{font-size:1.1rem;font-weight:500}
.consult{display:inline-block;align-self:flex-start;background:var(--green);color:var(--on-green);border-radius:16px;padding:12px 20px;font-family:var(--font-display);font-weight:900;font-size:clamp(1.15rem,4.8vw,1.55rem);line-height:1.4;box-shadow:var(--shadow)}
.hero-note{font-size:.9rem;color:var(--muted)}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-photo{aspect-ratio:4/3}

/* troubles */
.trouble-grid{display:grid;gap:14px}
.t-card{display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:12px;min-width:0}
.alt .t-card{background:var(--bg)}
.t-card .photo{aspect-ratio:1/1;border-radius:12px}
.t-card .photo .ph b{font-size:.78rem}
.t-card .photo .ph small,.t-card .photo .ph .chip{display:none}
.t-ico{width:40px;height:40px;border-radius:12px;background:var(--blue-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:8px}
.t-card h3{font-size:1.05rem;font-weight:700}
.t-card.main{border-color:var(--green);background:var(--green-soft)}
.t-card.main .t-ico{background:var(--green);color:var(--on-green)}
.closing{margin-top:30px;text-align:center;font-family:var(--font-display);font-weight:900;font-size:clamp(1.2rem,5vw,1.7rem);line-height:1.6}
.closing span{background:linear-gradient(transparent 62%,var(--green-soft) 62%);padding-inline:4px}

/* services */
.svc-grid{display:grid;gap:18px}
.svc{background:var(--bg);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.svc .photo{border-radius:0;border-width:0 0 2px 0;aspect-ratio:16/9}
.svc-body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:10px}
.svc-no{font-family:var(--font-display);font-weight:900;color:var(--accent);font-size:.9rem;letter-spacing:.06em}
.svc h3{font-size:1.2rem;font-weight:900}
.svc p{color:var(--muted);font-size:.93rem;line-height:1.75}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.chips li{background:var(--blue-soft);color:var(--ink);border-radius:999px;padding:3px 12px;font-size:.88rem;font-weight:500;line-height:1.6}
.svc-more{margin-top:26px;text-align:center;font-weight:700;font-size:1.05rem;font-family:var(--font-display)}
.cat-note{margin-top:10px;text-align:center;font-size:.8rem;color:var(--muted)}

/* cases */
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);color:var(--warn-ink);border-radius:14px;padding:12px 16px;font-size:.9rem;line-height:1.7;margin-bottom:24px}
.case-grid{display:grid;gap:20px}
.case{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ba figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.ba figcaption{font-size:.78rem;font-weight:700;color:var(--accent);letter-spacing:.06em}
.ba .photo{aspect-ratio:4/3;border-radius:12px}
.ba .photo .ph b{font-size:.78rem}
.ba .photo .ph small,.ba .photo .ph .chip{display:none}
.case-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:.7rem;font-weight:700;background:var(--warn-bg);color:var(--warn-ink);border-radius:6px;padding:1px 8px;line-height:1.7}
.case h3{font-size:1.1rem;font-weight:900}
.dl{display:grid;gap:2px}
.dl dt{font-size:.75rem;font-weight:700;color:var(--accent);letter-spacing:.06em}
.dl dd{margin:0 0 8px;font-size:.93rem;color:var(--muted);line-height:1.75}

/* owner */
.owner{display:grid;gap:28px;align-items:center}
.owner .photo{aspect-ratio:4/5;max-width:420px;margin-inline:auto}
.owner-name{font-family:var(--font-display);font-weight:900;font-size:1.7rem;line-height:1.3}
.owner-name small{display:block;font-size:.85rem;font-weight:500;color:var(--muted);letter-spacing:.14em;margin-top:2px}
.owner-role{font-size:.85rem;font-weight:700;color:var(--accent);letter-spacing:.1em}
.owner blockquote{margin:18px 0 0;padding:18px 20px;background:var(--surface);border-radius:16px;position:relative}
.alt .owner blockquote{background:var(--bg)}
.owner blockquote p+p{margin-top:10px}
.owner .draft{margin-top:12px;font-size:.8rem;color:var(--warn-ink);background:var(--warn-bg);border-radius:8px;padding:6px 12px;display:inline-block;line-height:1.6}

/* flow */
.flow-photo{aspect-ratio:21/9;margin-bottom:28px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:s}
.step{position:relative;display:grid;grid-template-columns:56px 1fr;gap:16px;padding-bottom:26px}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:27px;top:56px;bottom:0;width:2px;background:var(--blue)}
.step:last-child::before{display:none}
.step-no{width:56px;height:56px;border-radius:50%;background:var(--green);color:var(--on-green);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;line-height:1}
.step-no small{font-size:.58rem;letter-spacing:.1em;margin-bottom:2px}
.step-no b{font-size:1.35rem}
.step h3{font-size:1.08rem;font-weight:900;margin-top:2px}
.step p{margin-top:4px;color:var(--muted);font-size:.92rem;line-height:1.75}
.flow-note{margin-top:26px;font-size:.82rem;color:var(--muted)}

/* faq */
.faq{display:grid;gap:28px}
.faq-list{display:grid;gap:12px;min-width:0}
details{background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:hidden}
summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:16px 18px;font-weight:700;line-height:1.6}
summary::-webkit-details-marker{display:none}
summary .q{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--font-display);font-weight:900;font-size:.9rem}
summary .chev{margin-left:auto;flex:none;transition:transform .2s;color:var(--accent);margin-top:2px}
details[open] summary .chev{transform:rotate(180deg)}
.ans{padding:0 18px 18px 58px;color:var(--muted);font-size:.95rem;line-height:1.8}
.faq .photo{aspect-ratio:4/3}

/* contact */
.contact{display:grid;gap:28px}
.contact-card{background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:24px 20px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow);min-width:0}
.tel-num{font-family:var(--font-display);font-weight:900;font-size:clamp(1.8rem,8vw,2.6rem);line-height:1.2;letter-spacing:.02em;user-select:all;word-break:keep-all}
.info{display:grid;gap:12px;margin:0}
.info div{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start}
.info svg{color:var(--accent);margin-top:4px}
.info dt{display:none}
.info dd{margin:0;word-break:break-all;min-width:0}
.info .sm{display:block;font-size:.8rem;color:var(--muted);word-break:normal}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.contact .photo{aspect-ratio:4/3}

/* footer */
.ftr{background:var(--ink);color:var(--bg);padding-block:32px 28px;text-align:center}
.ftr b{font-family:var(--font-display);font-size:1.1rem}
.ftr small{display:block;margin-top:6px;opacity:.75;font-size:.78rem}
:root[data-theme="dark"] .ftr,
:root:not([data-theme="light"]) .ftr{background:var(--surface);color:var(--ink)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .ftr{background:var(--ink);color:var(--bg)}}
:root[data-theme="light"] .ftr{background:var(--ink);color:var(--bg)}

/* mobile call bar */
.callbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:none}
.callbar .btn{width:100%}
@media (max-width:759px){
  .callbar{display:block}
  .ftr{padding-bottom:96px}
}

@media (min-width:760px){
  section.sec{padding-block:96px}
  .hdr-tel{display:inline-flex}
  .hero{padding-block:56px 80px}
  .hero .wrap{grid-template-columns:1.05fr 1fr;align-items:center;gap:48px}
  .hero-photo{aspect-ratio:4/5}
  .pipe.p1{width:90px;height:360px;right:4%}
  .pipe.p2{width:320px;height:90px;top:230px}
  .trouble-grid{grid-template-columns:repeat(6,1fr)}
  .t-card{grid-column:span 2;grid-template-columns:1fr;padding:14px}
  .t-card:nth-child(n+4){grid-column:span 3}
  .t-card .photo{aspect-ratio:4/3}
  .t-card .photo .ph b{font-size:.9rem}
  .svc-grid{grid-template-columns:repeat(2,1fr)}
  .case-grid{grid-template-columns:repeat(3,1fr)}
  .owner{grid-template-columns:.8fr 1.2fr;gap:56px}
  .flow-photo{aspect-ratio:21/8}
  .steps{grid-template-columns:repeat(5,1fr);gap:18px}
  .step{grid-template-columns:1fr;padding-bottom:0;gap:12px}
  .step::before{left:64px;right:-18px;top:27px;bottom:auto;width:auto;height:2px}
  .faq{grid-template-columns:1.4fr 1fr;gap:48px;align-items:start}
  .contact{grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
  .contact-card{padding:34px}
}
@media (min-width:1000px){
  .svc-grid{grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .btn,.hdr,summary .chev{transition:none}
  .btn:hover{transform:none}
}
</style>
</head>
